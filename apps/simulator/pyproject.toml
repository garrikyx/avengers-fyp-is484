[project]
name = "telemetry-simulator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "telemetry-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.uv.sources]
telemetry-shared = { workspace = true }
