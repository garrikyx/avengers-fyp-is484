[project]
name = "telemetry-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "telemetry-shared",
]

[project.scripts]
telemetry-mcp = "telemetry_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_mcp"]

[tool.uv.sources]
telemetry-shared = { workspace = true }
