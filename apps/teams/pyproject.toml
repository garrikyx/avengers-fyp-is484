[project]
name = "telemetry-teams"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.28",
    "microsoft-agents-activity>=1.9.0",
    "microsoft-agents-authentication-msal>=1.9.0",
    "microsoft-agents-hosting-aiohttp>=1.9.0",
    "microsoft-agents-hosting-core>=1.9.0",
    "python-dotenv>=1.2.4",
    "telemetry-shared",
]

[project.scripts]
telemetry-teams = "teams_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_agent"]

[tool.uv.sources]
telemetry-shared = { workspace = true }
