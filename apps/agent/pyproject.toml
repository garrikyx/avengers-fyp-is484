[project]
name = "telemetry-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "telemetry-shared",
    "pyyaml",
    "httpx>=0.27",
]

[project.scripts]
telemetry-parser = "telemetry_agent.parser.cli:main"
telemetry-agent-heartbeat = "telemetry_agent.health.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_agent"]

[tool.uv.sources]
telemetry-shared = { workspace = true }
