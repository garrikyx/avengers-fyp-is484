# Live rule config, parsed by telemetry_agent.rules.config_loader.load_rules
# (FR-RUL-008/009). Reloadable via SIGHUP without restarting the agent or
# losing alert state (RuleEngine.apply_rules); a malformed file is rejected
# with an error naming the offending rule and the process keeps serving its
# last-known-good rules. If this file is absent, the agent falls back to
# telemetry_agent.rules.defaults.DEFAULT_RULES — the two are kept in sync;
# this is a direct YAML transcription of that tuple (spec 005 §1.2).
#
# Two conditions differing only in threshold are one rule with multiple
# severity tiers, not two separate rules (FR-RUL-002) — `tiers` is ordered
# least->most severe.

rules:
  - name: HighRejectRate
    kind: rate
    source: indicator
    metric: reject_rate
    operator: ">"
    tiers:
      - severity: warning
        threshold: 0.03
      - severity: critical
        threshold: 0.05
    window: 5m
    minSamples: 20
    for: 2m
    resolveAfter: 5m

  - name: RejectSpike
    kind: threshold
    source: counter
    metric: orders_rejected
    operator: ">"
    tiers:
      - severity: warning
        threshold: 50
    window: 1m

  - name: CancelRejectSpike
    kind: threshold
    source: counter
    metric: cancel_rejects
    operator: ">"
    tiers:
      - severity: warning
        threshold: 20
    window: 5m

  - name: SessionRejects
    kind: threshold
    source: counter
    metric: session_rejects
    operator: ">"
    tiers:
      - severity: critical
        threshold: 5
    window: 5m

  - name: PendingOrderTimeout
    kind: threshold
    source: gauge
    metric: oldest_pending_age_seconds
    operator: ">"
    tiers:
      - severity: warning
        threshold: 30

  - name: AckLatencyBreach
    kind: latency
    source: latency_p95
    metric: ack_latency_ms
    operator: ">"
    tiers:
      - severity: warning
        threshold: 500
      - severity: critical
        threshold: 1000
    window: 5m
    minSamples: 50

  - name: ParseErrorRate
    kind: rate
    source: indicator
    metric: parse_error_rate
    operator: ">"
    tiers:
      - severity: warning
        threshold: 0.01
      - severity: critical
        threshold: 0.25
    window: 5m
    minSamples: 20
    dependsOnLogActivity: false

  # App-log lines count as activity too (spec 003 FR-PRS-010, UBS-122).
  - name: NoLogActivity
    kind: absence
    source: counter
    metric: messages_total
    extraCounters: [app_log_lines]
    operator: "=="
    tiers:
      - severity: critical
        threshold: 0
    window: 1m
    dependsOnLogActivity: false

  - name: NoExecutions
    kind: absence
    source: counter
    metric: executions
    operator: "=="
    tiers:
      - severity: warning
        threshold: 0
    window: 15m
    guardMetric: orders_submitted

  - name: FixSessionDown
    kind: threshold
    source: counter
    metric: logouts
    extraCounters: [heartbeat_timeouts]
    operator: ">="
    tiers:
      - severity: critical
        threshold: 1
    window: 1m
    dependsOnLogActivity: false

  - name: SeqGapDetected
    kind: threshold
    source: counter
    metric: seq_gaps
    operator: ">"
    tiers:
      - severity: warning
        threshold: 0
    window: 1m
    dependsOnLogActivity: false

  - name: ClockSkew
    kind: threshold
    source: counter
    metric: clock_skew_events
    operator: ">"
    tiers:
      - severity: warning
        threshold: 10
    window: 5m
    dependsOnLogActivity: false

  - name: CallbackFailing
    kind: threshold
    source: counter
    metric: callback_failures
    operator: ">"
    tiers:
      - severity: warning
        threshold: 3
    window: 5m
    dependsOnLogActivity: false

  # Reads a gauge, not a window: FR-PUB-005's exponential backoff spaces
  # failed attempts further apart as an outage drags on, so a windowed
  # publish_failures count measures the retry schedule rather than the
  # outage (spec 005 §1.2, FR-MET-031).
  - name: BackendUnreachable
    kind: threshold
    source: gauge
    metric: consecutive_publish_failures
    operator: ">="
    tiers:
      - severity: warning
        threshold: 5
    dependsOnLogActivity: false

  # Signature rules (spec 005 §1, UBS-122): `signature` is a label from
  # agent.yaml `parsing.errorSignatures`; each rule counts only its own
  # pattern. Warn on the first match — one OOM or lost DB connection is
  # already an incident — and escalate on repeats (AppOutOfMemory's
  # critical tier is spec 005's own "3+ in 1m" example).
  - name: AppOutOfMemory
    kind: signature
    source: counter
    metric: app_error_signatures
    signature: out_of_memory
    operator: ">="
    tiers:
      - severity: warning
        threshold: 1
      - severity: critical
        threshold: 3
    window: 1m
    for: 0s
    dependsOnLogActivity: false

  - name: AppDbConnectionLost
    kind: signature
    source: counter
    metric: app_error_signatures
    signature: db_connection_lost
    operator: ">="
    tiers:
      - severity: warning
        threshold: 1
      - severity: critical
        threshold: 5
    window: 5m
    for: 0s
    dependsOnLogActivity: false
